name: LinkedIn job alert

# Lo avvia cron-job.org ogni 15 minuti (workflow_dispatch).
# Niente "schedule" di GitHub: due "sveglie" insieme creano esecuzioni doppie e conflitti.
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: job-alert
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python bot.py
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_CHAT_ID_ALICE: ${{ secrets.TELEGRAM_CHAT_ID_ALICE }}
          TELEGRAM_CHAT_ID_EDOARDO: ${{ secrets.TELEGRAM_CHAT_ID_EDOARDO }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          PROFILO: ${{ secrets.PROFILO }}
          PROFILO_EDOARDO: ${{ secrets.PROFILO_EDOARDO }}
      - name: Salva offerte già viste
        if: always()
        run: |
          git config user.name "job-bot"
          git config user.email "job-bot@users.noreply.github.com"
          cp seen.json /tmp/mine.json
          for i in 1 2 3; do
            # riparte dall'ultima versione del repo e unisce le offerte viste (nessuna si perde)
            git fetch -q origin main
            git reset -q --hard origin/main
            python - <<'PY'
          import json, pathlib
          def load(p):
              d = json.loads(pathlib.Path(p).read_text() or "[]")
              return {"seen": d} if isinstance(d, list) else d
          mine, theirs = load("/tmp/mine.json"), load("seen.json")
          out = {**theirs, **mine}
          out["seen"] = sorted(set(mine.get("seen", [])) | set(theirs.get("seen", [])))
          for k in ("ai_spent_usd", "last_warn", "ai_credit_warn"):
              out[k] = max(mine.get(k, 0), theirs.get(k, 0))
          pathlib.Path("seen.json").write_text(json.dumps(out))
          PY
            git add seen.json
            git diff --cached --quiet && exit 0
            git commit -q -m "update seen jobs"
            git push -q && exit 0
            sleep 5
          done
          exit 1
